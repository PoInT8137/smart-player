# Smart Player — клавиши (остальные — стандартные mpv)
# Пробел — пауза, ← → — перемотка 10 с, ↑ ↓ — громкость, F / двойной клик — полный экран
LEFT  seek -10
RIGHT seek 10
Shift+LEFT  seek -60
Shift+RIGHT seek 60
UP    add volume 5
DOWN  add volume -5
ENTER cycle fullscreen
f     cycle fullscreen
ESC   set fullscreen no
MBTN_LEFT_DBL cycle fullscreen
a     script-binding uosc/audio
s     script-binding uosc/subtitles
n     playlist-next
p     playlist-prev
m     script-binding uosc/menu
MBTN_RIGHT script-binding uosc/menu
