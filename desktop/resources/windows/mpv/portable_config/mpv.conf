# Smart Player — настройки видеодвижка mpv

# Качество и аппаратное декодирование
profile=high-quality
vo=gpu-next
hwdec=auto-safe
# Плавность: подгоняем воспроизведение под частоту экрана (24p на 60 Гц без рывков)
video-sync=display-resample

# Интерфейс — uosc (встроенный OSC выключен)
osc=no
osd-bar=no
border=yes
force-window=immediate
keepaspect-window=yes
autofit-larger=90%x90%
title=${?media-title:${media-title} — }Smart Player

# Сеть и торренты: большой кэш, терпеливые таймауты (TorrServer набирает пиров)
cache=yes
demuxer-max-bytes=256MiB
demuxer-readahead-secs=60
network-timeout=60
user-agent="SmartPlayer/0.3 (Windows)"

# Языки по умолчанию
alang=ru,rus,russian,en,eng
slang=ru,rus,russian,en,eng
sub-auto=fuzzy

# Субтитры «как в кинотеатре»: белый текст с мягкой тенью, без чёрной плашки
sub-font="Segoe UI Semibold"
sub-font-size=46
sub-color="#FFFFFF"
sub-border-size=0
sub-shadow-offset=2
sub-shadow-color="#D9000000"
sub-back-color="#00000000"
sub-margin-y=42

screenshot-directory=~~desktop/
